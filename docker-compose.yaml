services:
  db:
    image: pgvector/pgvector:pg18-trixie
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: hwp-qna-backend:latest
    depends_on:
      - db
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"

volumes:
  postgres_data: {}
