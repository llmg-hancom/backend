name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  # 1. 빌드 및 푸시 단계 (CI)
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          driver: docker-container

      - name: Build and Push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. 배포 단계 (CD)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose file via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yaml"
          target: "/home/${{ secrets.SERVER_USER }}/backend/"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 스크립트 실행
          script: |
            cd /home/${{ secrets.SERVER_USER }}/backend/

            # 1. 환경 변수 설정 (docker-compose.prod.yaml에서 사용)
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}

            # 2. GitHub Container Registry 로그인 (GITHUB_TOKEN 사용)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # 3. 최신 이미지 다운로드
            docker-compose -f docker-compose.prod.yaml pull

            # 4. 컨테이너 재시작
            docker-compose -f docker-compose.prod.yaml up -d

            # 5. 정리
            docker image prune -f
