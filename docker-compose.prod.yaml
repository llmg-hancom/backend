services:
  db:
    image: ghcr.io/llmg-hancom/pgvector-korean:latest
    shm_size: '2g'
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      dockerfile: Dockerfile.prod
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      dockerfile: Dockerfile.prod
    command: .venv/bin/celery -A workers.celery_app worker --loglevel=info
    env_file: .env
    mem_limit: '8g'
    shm_size: '512m'
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis

  redis:
    image: redis:8.4-rc1-alpine

volumes:
  postgres_data:
    external: true
    name: postgrestest_postgres_data
